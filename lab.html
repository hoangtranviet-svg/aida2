<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng thí nghiệm 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lab/lab.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="bar">
    <a class="back" href="./" onclick="if(history.length>1){history.back();return false}">← Thư viện</a>
    <span class="code">…</span>
    <h1>Đang tải…</h1>
    <button class="btn full" type="button" title="Toàn màn hình">⛶</button>
  </header>
  <main id="stage">
    <div id="canvas-wrap"></div>
    <div id="label-layer"></div>
    <div id="legend"></div>
    <div id="readout"></div>
    <div id="info"></div>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="loading">Đang dựng mô hình 3D…</div>
  </main>
  <aside id="panel">
    <div class="head"><div style="font-size:12px;color:var(--muted)">Mục tiêu học tập gắn với mô-đun</div><div class="objs" id="objs"></div></div>
    <nav class="tabs">
      <button class="tab on" data-t="explore" type="button">Khám phá</button>
      <button class="tab" data-t="tasks" type="button">Nhiệm vụ</button>
      <button class="tab" data-t="src" type="button">Nguồn</button>
    </nav>
    <div class="body"></div>
  </aside>
</div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const id = (q.get('m') || location.hash.replace('#', '') || '09').replace(/\D/g, '').padStart(2, '0');
  try {
    const { runLab } = await import('./lab/core.js');
    const mod = await import(`./lab/mods/m${id}.js`);
    await runLab(mod.default);
  } catch (e) {
    console.error(e);
    document.getElementById('loading').innerHTML = 'Không mở được mô-đun ' + id + '.<br><small>' + (e && e.message ? e.message : e) + '</small>';
  }
</script>
</body>
</html>
